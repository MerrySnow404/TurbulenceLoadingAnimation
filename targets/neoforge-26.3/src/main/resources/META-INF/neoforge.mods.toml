modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = "${mod_description}"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},26.4)"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "turbulenceloadinganimation.mixins.json"

[[dependencies.${mod_id}]]
modId = "apricityui"
type = "required"
versionRange = "[1.3.1,)"
ordering = "AFTER"
side = "CLIENT"
